name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  schedule:
    - cron: '0 4 * * 1'   # chaque lundi : correctifs Alpine
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version btop
        id: v
        run: |
          echo "btop=$(sed -n 's/^ARG BTOP_VERSION=//p' Dockerfile | head -1)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build amd64 pour les tests
        uses: docker/build-push-action@v6
        with:
          context: .
          pull: true
          load: true
          tags: btop-web:ci

      - name: Tests
        run: ./tests/test.sh btop-web:ci

      - name: Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: btop-web:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Tags et labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/btop-web
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.v.outputs.btop }},enable={{is_default_branch}}
            type=raw,value=${{ steps.v.outputs.btop }}-${{ steps.v.outputs.date }},enable={{is_default_branch}}
            type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.title=btop-web
            org.opencontainers.image.description=btop dans le navigateur via ttyd, sécurisé pour le LAN

      - name: Login GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build multi-arch et push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          pull: true
          push: true
          platforms: linux/amd64,linux/arm64
          sbom: true
          provenance: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.v.outputs.btop }}-${{ steps.v.outputs.date }}
            REVISION=${{ github.sha }}
            CREATED=${{ steps.v.outputs.created }}
