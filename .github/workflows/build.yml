name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  schedule:
    - cron: '0 4 * * 1'   # every Monday: Alpine fixes
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    # "build" stays the name of the Alpine job: the main-protection ruleset requires that check
    name: build${{ matrix.suffix }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: Dockerfile
            suffix: ''
            latest: latest
            platforms: linux/amd64,linux/arm64
            # btop-web: name before 1.1.0, still published so existing installs keep updating
            images: |
              ghcr.io/erreur32/topviewr
              ghcr.io/erreur32/btop-web
          # Debian (glibc) variant for NVIDIA; amd64 only (arm64 NVIDIA boards are Jetsons, which nvtop reads differently)
          - dockerfile: Dockerfile.nvidia
            suffix: -nvidia
            latest: nvidia
            platforms: linux/amd64
            images: ghcr.io/erreur32/topviewr
    steps:
      - uses: actions/checkout@v4

      - name: btop version
        id: v
        run: |
          echo "btop=$(sed -n 's/^ARG BTOP_VERSION=//p' Dockerfile | head -1)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4

      - name: Build amd64 for tests
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          pull: true
          load: true
          tags: topviewr:ci

      - name: Tests
        run: ./tests/test.sh topviewr:ci

      - name: Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: topviewr:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.images }}
          tags: |
            type=raw,value=${{ matrix.latest }},enable={{is_default_branch}}
            type=raw,value=${{ steps.v.outputs.btop }}${{ matrix.suffix }},enable={{is_default_branch}}
            type=raw,value=${{ steps.v.outputs.btop }}-${{ steps.v.outputs.date }}${{ matrix.suffix }},enable={{is_default_branch}}
            type=semver,pattern=v{{version}},suffix=${{ matrix.suffix }}
          labels: |
            org.opencontainers.image.title=TopviewR
            org.opencontainers.image.description=btop, htop or nvtop in the browser via ttyd, hardened for LAN use
            org.opencontainers.image.licenses=Apache-2.0 AND GPL-2.0-or-later AND GPL-3.0-or-later AND MIT AND ISC

      - name: Login GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build multi-arch and push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          pull: true
          push: true
          platforms: ${{ matrix.platforms }}
          sbom: true
          provenance: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.v.outputs.btop }}-${{ steps.v.outputs.date }}
            REVISION=${{ github.sha }}
            CREATED=${{ steps.v.outputs.created }}
