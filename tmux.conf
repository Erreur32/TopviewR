# TopviewR session layer: Esc opens a menu and the bottom bar is clickable, to switch between btop, htop and nvtop.
# Every default binding is removed (no prefix, no command prompt, no new window or split): nothing here can start
# a shell. The only commands are respawning the pane with one of the three tools, and closing the session.

set -g prefix None
set -g prefix2 None
unbind -a -T prefix
unbind -a -T root
unbind -a -T copy-mode
unbind -a -T copy-mode-vi
# anything that would open a new pane gets the tool loop, never a shell
set -g default-command /usr/local/bin/menu.sh

set -s escape-time 20
set -g default-terminal tmux-256color
set -as terminal-features ',xterm*:RGB'
setenv -g COLORTERM truecolor
set -g mouse on
set -g destroy-unattached on
set -s exit-empty on
set -g set-titles off
set -g history-limit 2000

# --- bottom bar: TopviewR @ host  Alt+1 [btop] Alt+2 htop Alt+3 nvtop  ...  Esc: menu (each name is clickable) ---
set -g status on
set -g status-position bottom
set -g status-interval 0
set -g status-style bg=#1f2937,fg=#9ca3af
set -g status-format[0] "#[align=left] #[bold]#[fg=#e5e7eb]Topview#[fg=#22c55e]R#[nobold]#[fg=#9ca3af] @ #h   #[range=user|btop]#[fg=#6b7280]Alt+1#[default]#{?#{==:#{@tool},btop},#[fg=#4ade80]#[bg=#374151]#[bold] btop #[default], btop }#[norange] #[range=user|htop]#[fg=#6b7280]Alt+2#[default]#{?#{==:#{@tool},htop},#[fg=#4ade80]#[bg=#374151]#[bold] htop #[default], htop }#[norange] #[range=user|nvtop]#[fg=#6b7280]Alt+3#[default]#{?#{==:#{@tool},nvtop},#[fg=#4ade80]#[bg=#374151]#[bold] nvtop #[default], nvtop }#[norange]#[align=right]#[range=user|menu]#[fg=#e5e7eb] Esc#[fg=#9ca3af]: menu #[norange]"

# --- Esc: switch menu, on top of every tool (its own Esc stays reachable with m) ---
set -g menu-style bg=#111827,fg=#e5e7eb
set -g menu-selected-style bg=#374151,fg=#f9fafb,bold
set -g menu-border-style fg=#4b5563
set -g menu-border-lines rounded
# -M: mouse works even when the menu is opened from the keyboard; -O: a click picks an item, a click outside closes
# title rows end in the menu background colour: tmux compares an item's length in bytes (not its width) with the
# terminal width and appends a '>' to these UTF-8 rows, which this hides
bind -n Escape display-menu -M -O -T "#[align=centre]#[fg=#9ca3af] @ #h " -x C -y C -- \
	"-#[nodim]#[fg=#f9fafb]  ████████╗ ██████╗ ██████╗ ██╗   ██╗██╗███████╗██╗    ██╗#[fg=#86efac]██████╗ #[fg=#111827]" "" "" \
	"-#[nodim]#[fg=#e5e7eb]  ╚══██╔══╝██╔═══██╗██╔══██╗██║   ██║██║██╔════╝██║    ██║#[fg=#4ade80]██╔══██╗#[fg=#111827]" "" "" \
	"-#[nodim]#[fg=#d1d5db]     ██║   ██║   ██║██████╔╝██║   ██║██║█████╗  ██║ █╗ ██║#[fg=#22c55e]██████╔╝#[fg=#111827]" "" "" \
	"-#[nodim]#[fg=#9ca3af]     ██║   ██║   ██║██╔═══╝ ╚██╗ ██╔╝██║██╔══╝  ██║███╗██║#[fg=#16a34a]██╔══██╗#[fg=#111827]" "" "" \
	"-#[nodim]#[fg=#6b7280]     ██║   ╚██████╔╝██║      ╚████╔╝ ██║███████╗╚███╔███╔╝#[fg=#15803d]██║  ██║#[fg=#111827]" "" "" \
	"-#[nodim]#[fg=#4b5563]     ╚═╝    ╚═════╝ ╚═╝       ╚═══╝  ╚═╝╚══════╝ ╚══╝╚══╝ #[fg=#166534]╚═╝  ╚═╝#[fg=#111827]" "" "" \
	"" \
	"#{?#{==:#{@tool},btop},  >  ,     }btop     Alt+1   CPU, memory, disks, network, GPU  " 1 { respawn-pane -k "/usr/local/bin/menu.sh --run btop" } \
	"#{?#{==:#{@tool},htop},  >  ,     }htop     Alt+2   processes                         " 2 { respawn-pane -k "/usr/local/bin/menu.sh --run htop" } \
	"#{?#{==:#{@tool},nvtop},  >  ,     }nvtop    Alt+3   GPU #{@gpu}                       " 3 { respawn-pane -k "/usr/local/bin/menu.sh --run nvtop" } \
	"" \
	"     Esc to #{@tool}  (its own menu)                      " m { send-keys Escape } \
	"     Close this session                                   " q { kill-server }

# --- Alt+1/2/3: switch at once, without the menu. Digits alone belong to the tools (btop shows/hides its boxes,
# htop searches a PID); none of the three uses Alt+digit ---
bind -n M-1 respawn-pane -k "/usr/local/bin/menu.sh --run btop"
bind -n M-2 respawn-pane -k "/usr/local/bin/menu.sh --run htop"
bind -n M-3 respawn-pane -k "/usr/local/bin/menu.sh --run nvtop"
# with Shift too (AZERTY digits need it): the terminal then sends the US shifted key, Alt+! Alt+@ Alt+#
bind -n 'M-!' respawn-pane -k "/usr/local/bin/menu.sh --run btop"
bind -n 'M-@' respawn-pane -k "/usr/local/bin/menu.sh --run htop"
bind -n 'M-#' respawn-pane -k "/usr/local/bin/menu.sh --run nvtop"

# --- mouse: clicks on the bar switch tools; everything else goes to the tool (btop and htop use the mouse) ---
bind -n MouseDown1Status if -F "#{==:#{mouse_status_range},btop}" { respawn-pane -k "/usr/local/bin/menu.sh --run btop" } { if -F "#{==:#{mouse_status_range},htop}" { respawn-pane -k "/usr/local/bin/menu.sh --run htop" } { if -F "#{==:#{mouse_status_range},nvtop}" { respawn-pane -k "/usr/local/bin/menu.sh --run nvtop" } { if -F "#{==:#{mouse_status_range},menu}" { send-keys -K Escape } } } }
bind -n MouseDown1Pane send-keys -M
bind -n MouseUp1Pane send-keys -M
bind -n MouseDrag1Pane send-keys -M
bind -n MouseDragEnd1Pane send-keys -M
bind -n MouseDown3Pane send-keys -M
bind -n MouseUp3Pane send-keys -M
bind -n WheelUpPane send-keys -M
bind -n WheelDownPane send-keys -M
